[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-engine"
version = "0.1.0"
description = "Algorithmic trading platform — ML/quant engine"
readme = "README.md"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "data",
    "features",
    "models",
    "strategies",
    "backtesting",
    "risk",
    "execution",
    "api",
]

# ── Core runtime dependencies ────────────────────────────────────────────────
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.2",
    "httpx>=0.27",
    "websockets>=12.0",
    "APScheduler>=3.10",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "aiofiles>=23.2",
]

[project.optional-dependencies]

# ── Data feeds ───────────────────────────────────────────────────────────────
data = [
    "yfinance>=0.2",
    "alpaca-py>=0.20",
    "python-binance>=1.0",
    "pycoingecko>=3.1",
    "newsapi-python>=0.2",
    "alpha-vantage>=2.3",
    "requests>=2.31",
    "beautifulsoup4>=4.12",   # SEC EDGAR HTML parsing
    "lxml>=5.2",
]

# ── Machine learning ─────────────────────────────────────────────────────────
ml = [
    "torch>=2.3",
    "gpytorch>=1.12",
    "transformers>=4.41",
    "huggingface-hub>=0.23",
    "lightgbm>=4.3",
    "shap>=0.45",
    "scikit-learn>=1.5",
    "stable-baselines3>=2.3",
    "gymnasium>=0.29",
]

# ── API server ───────────────────────────────────────────────────────────────
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

# ── Development / testing ─────────────────────────────────────────────────────
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-forked>=1.6",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
